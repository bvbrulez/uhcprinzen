name: Test finance app

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check src/scripts/app.js

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_ADMIN_EMAIL: admin@example.test
      E2E_ADMIN_PASSWORD: LocalOnlyAdmin123!
      E2E_MEMBER_EMAIL: member@example.test
      E2E_MEMBER_PASSWORD: LocalOnlyMember123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: supabase start -x studio,inbucket,vector,logflare,edge-runtime,realtime,imgproxy
      - name: Export local Supabase credentials
        run: supabase status --output env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      - name: Install the fresh local schema
        run: TEST_DATABASE_URL="$DB_URL" ALLOW_DATABASE_TESTS=1 npm run test:db:install
      - name: Run database integration tests
        run: TEST_DATABASE_URL="$DB_URL" ALLOW_DATABASE_TESTS=1 npm run test:db
      - name: Create disposable browser-test users
        run: E2E_SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node tests/e2e/create-local-users.mjs
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: E2E_SUPABASE_URL="$API_URL" E2E_SUPABASE_ANON_KEY="$ANON_KEY" npm run test:e2e
